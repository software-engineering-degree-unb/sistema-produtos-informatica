<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página inicial - Administrador</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/icon.ico">
    <link href="/assets/css/home.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body class="loggedin">
{% if request.query_params.get('success') %}
            <div class="success-animation fade-out">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
                    <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
                </svg>
            </div>
            <script>
                setTimeout(function() {
                    const successAnimation = document.querySelector('.success-animation');
                    successAnimation.classList.add('hidden');

                    setTimeout(function() {
                        window.location.href = "/";
                    }, 1000);
                }, 2000);
            </script>
        {% endif %}
        <nav class="navtop">
            <div class="nav-left">
                <img src="/assets/img/logo2.png" alt="">
            </div>
            <div class="nav-right">
                <a href="/"><i class="fas fa-house"></i>Página Inicial</a>
                <a href="/perfil"><i class="fas fa-user-circle"></i>Meu Perfil</a>
                <a href="/logout"><i class="fas fa-sign-out-alt"></i>Sair</a>
            </div>
        </nav>

    <div class="content">
        <h2>Página Inicial - Administrador</h2>

        <p>Seja bem vindo!</p>
        <div class="functions">
            <h2>Funções</h2>
                <div class="function-group">
                    <a href="/usuarios" class="function">
                        <i class="fas fa-person-circle-plus"></i>
                        <p>Gerenciar Usuários</p>
                    </a>

                    <a href="/produtos" class="function">
                        <i class="fa-solid fa-tachograph-digital"></i>
                        <p>Gerenciar Produtos</p>
                    </a>

                    <a href="/historico/alteracoes" class="function">
                        <i class="fa-solid fa-rectangle-list"></i>
                        <p>Histórico de Alterações</p>
                    </a>

                    <a href="/historico/login" class="function">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <p>Histórico de Acessos</p>
                    </a>

                    <a href="/vendas/mensal" class="function">
                        <i class="fas fa-calendar-alt"></i>
                        <p>Relatório Mensal de Vendas</p>
                    </a>

                    <a href="/vendas/top-clientes" class="function">
                        <i class="fas fa-users"></i>
                        <p>Top Clientes</p>
                    </a>

                    <a href="/vendas/canais" class="function">
                        <i class="fa-solid fa-store"></i>
                        <p>Vendas por Canal</p>
                    </a>
                </div>
        </div>
    </div>
</body>
</html>
